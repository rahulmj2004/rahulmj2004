<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 116" width="1200" height="116" role="img" aria-label="Pull request #16943 to ohcnetwork/care_fe (open): Show schedule exception reasons in a tooltip">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050405"/><stop offset="1" stop-color="#16070a"/></linearGradient>
    <filter id="blur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="clip"><rect width="1200" height="116" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="116" fill="url(#bg)"/>
    <circle cx="960" cy="116" r="120" fill="#7f1d1d" opacity="0.35" filter="url(#blur)">
      <animate attributeName="cx" dur="17s" repeatCount="indefinite" values="960;660;960" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      <animate attributeName="opacity" dur="5s" repeatCount="indefinite" values="0.35;0.2;0.35"/>
    </circle>
    <g fill="#d6d3d1" filter="url(#blur)" opacity="0.07">
      <ellipse cx="200" cy="106" rx="340" ry="35"><animate attributeName="cx" dur="28s" repeatCount="indefinite" values="200;1000;200"/></ellipse>
      <ellipse cx="1050" cy="116" rx="300" ry="29"><animate attributeName="cx" dur="36s" repeatCount="indefinite" values="1050;250;1050"/></ellipse>
    </g>
    <text x="44" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#ef4444">PULL REQUEST  ·  ohcnetwork/care_fe #16943</text>
    <text x="44" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#ece7e1" text-anchor="start">Show schedule exception reasons in a tooltip</text>
    <rect x="1040" y="38" width="116" height="36" rx="18" fill="#12140a" stroke="#a3e635"/>
    <circle cx="1064" cy="56" r="5" fill="#a3e635"/>
    <circle cx="1064" cy="56" r="5" fill="none" stroke="#a3e635"><animate attributeName="r" dur="2.4s" repeatCount="indefinite" values="5;13"/><animate attributeName="opacity" dur="2.4s" repeatCount="indefinite" values="0.8;0"/></circle>
    <text x="1080" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#a3e635">Open</text>
    

    <rect x="0.5" y="0.5" width="1199" height="115" rx="16" fill="none" stroke="#2e1418"/>
  </g>
</svg>
