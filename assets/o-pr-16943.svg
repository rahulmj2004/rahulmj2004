<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 116" width="1200" height="116" role="img" aria-label="Pull request #16943 to ohcnetwork/care_fe (open): Show schedule exception reasons in a tooltip">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#121c33"/></linearGradient>
    <linearGradient id="acc" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#6366f1"/><stop offset="0.5" stop-color="#38bdf8"/><stop offset="1" stop-color="#6366f1"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1200 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="60"/></filter>
    <clipPath id="clip"><rect width="1200" height="116" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="116" fill="url(#bg)"/>
    <circle cx="984" cy="116" r="120" fill="#6366f1" opacity="0.22" filter="url(#blur)">
      <animate attributeName="cx" dur="16s" repeatCount="indefinite" values="984;720;984" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </circle>
    <text x="44" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2.5" fill="#8b9bb4">PULL REQUEST  ·  ohcnetwork/care_fe #16943</text>
    <text x="44" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#f8fafc" text-anchor="start">Show schedule exception reasons in a tooltip</text>
    <rect x="1040" y="38" width="116" height="36" rx="18" fill="#16213a" stroke="#34d399"/>
    <circle cx="1064" cy="56" r="5" fill="#34d399"/>
    <circle cx="1064" cy="56" r="5" fill="none" stroke="#34d399"><animate attributeName="r" dur="2.4s" repeatCount="indefinite" values="5;13"/><animate attributeName="opacity" dur="2.4s" repeatCount="indefinite" values="0.8;0"/></circle>
    <text x="1080" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#34d399">Open</text>
    
    <rect x="0.5" y="0.5" width="1199" height="115" rx="16" fill="none" stroke="#263248"/>
  </g>
</svg>
