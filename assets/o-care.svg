<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 222" width="1200" height="222" role="img" aria-label="CARE: I contribute to CARE by the Open Healthcare Network, a Digital Public Good used for healthcare delivery.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#121c33"/></linearGradient>
    <linearGradient id="acc" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#6366f1"/><stop offset="0.5" stop-color="#38bdf8"/><stop offset="1" stop-color="#6366f1"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1200 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="60"/></filter>
    <clipPath id="clip"><rect width="1200" height="222" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="222" fill="url(#bg)"/>
    <circle cx="984" cy="222" r="155" fill="#6366f1" opacity="0.22" filter="url(#blur)">
      <animate attributeName="cx" dur="16s" repeatCount="indefinite" values="984;720;984" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </circle>
    <text x="44" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2.5" fill="#8b9bb4">OPEN SOURCE</text>
    <text x="44" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#f8fafc" text-anchor="start">CARE</text>
    <text x="44" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#cbd5e1" text-anchor="start">I contribute to CARE by the Open Healthcare Network, a Digital Public Good used for</text>
    <text x="44" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#cbd5e1" text-anchor="start">healthcare delivery.</text>
    <rect x="44" y="173" width="177" height="27" rx="13.5" fill="#16213a" stroke="#263248"/>
    <text x="132" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#cbd5e1" text-anchor="middle">ohcnetwork/care_fe</text>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#38bdf8">
      <text x="1122" y="192" text-anchor="end">View repository</text>
      <text x="1132" y="192">→<animateTransform attributeName="transform" type="translate" dur="1.8s" repeatCount="indefinite" values="0 0;7 0;0 0" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/></text>
    </g>
    <rect width="1200" height="3" fill="url(#acc)"/>
    <rect x="0.5" y="0.5" width="1199" height="221" rx="16" fill="none" stroke="#263248"/>
  </g>
</svg>
