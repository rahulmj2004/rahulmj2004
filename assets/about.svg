<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 152" width="1200" height="152" role="img" aria-label="About: Computer Science student from Thrissur, Kerala. I build AI-powered products and contribute to open source, mostly around healthcare.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c0a20"/><stop offset="0.6" stop-color="#1a1140"/><stop offset="1" stop-color="#2a1452"/></linearGradient>
    <linearGradient id="stripe" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="repeat"><stop offset="0" stop-color="#ff5fa2"/><stop offset="0.33" stop-color="#9d7bff"/><stop offset="0.66" stop-color="#5ce1ff"/><stop offset="1" stop-color="#ff5fa2"/></linearGradient>
    <linearGradient id="energy" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff5fa2"/><stop offset="0.55" stop-color="#9d7bff"/><stop offset="1" stop-color="#5ce1ff"/></linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5ce1ff" stop-opacity="0"/><stop offset="1" stop-color="#5ce1ff" stop-opacity="0.9"/></linearGradient>
    <radialGradient id="htg" gradientUnits="userSpaceOnUse" cx="1200" cy="0" r="380"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#000000"/></radialGradient>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="1.7" fill="#ffffff"/></pattern>
    <mask id="htm" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="152"><rect width="1200" height="152" fill="url(#htg)"/></mask>
    <filter id="blur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
    <clipPath id="clip"><rect width="1200" height="152" rx="16"/></clipPath>
    <path id="petal" d="M0 -8 C5 -6 6 2 1.5 7 L0 5.2 L-1.5 7 C-6 2 -5 -6 0 -8Z"/>
    <path id="spark" d="M0 -10 Q0.9 -0.9 10 0 Q0.9 0.9 0 10 Q-0.9 0.9 -10 0 Q-0.9 -0.9 0 -10Z"/>
    <g id="shuriken"><path d="M0 -15 L3.5 -5 L11 -11 L5 -3.5 L15 0 L5 3.5 L11 11 L3.5 5 L0 15 L-3.5 5 L-11 11 L-5 3.5 L-15 0 L-5 -3.5 L-11 -11 L-3.5 -5Z" fill="#dfe6ff" stroke="#6f7bb8" stroke-width="1"/><circle r="3" fill="#150f33"/></g>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="152" fill="url(#bg)"/>
    <circle cx="960" cy="152" r="110" fill="#ff5fa2" opacity="0.17" filter="url(#blur)">
      <animate attributeName="cx" dur="14s" repeatCount="indefinite" values="960;600;960" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </circle>
    <circle cx="240" cy="0" r="110" fill="#5ce1ff" opacity="0.09" filter="url(#blur)">
      <animate attributeName="cx" dur="18s" repeatCount="indefinite" values="240;520;240" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </circle>
    <rect width="1200" height="152" fill="url(#dots)" mask="url(#htm)" opacity="0.13"/>
    <rect x="44" y="38" width="6" height="84" rx="3" fill="url(#stripe)"><animate attributeName="height" dur="4s" repeatCount="indefinite" values="84;64;84" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/></rect>
    <text x="68" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="3" fill="#ff5fa2">ABOUT<tspan dx="14" font-family="'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', 'Noto Sans CJK JP', Meiryo, sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#8f86b8">自己紹介</tspan></text>
    <text x="68" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#d6cfe8" text-anchor="start">Computer Science student from Thrissur, Kerala. I build AI-powered products</text>
    <text x="68" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#d6cfe8" text-anchor="start">and contribute to open source, mostly around healthcare.</text>
    <g transform="translate(1150 44)"><use href="#spark" fill="#ffd76a" transform="scale(0)"><animateTransform attributeName="transform" type="scale" dur="2.6s" begin="0.0s" repeatCount="indefinite" values="0;1.0;0" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/></use></g><g transform="translate(1124 60)"><use href="#spark" fill="#5ce1ff" transform="scale(0)"><animateTransform attributeName="transform" type="scale" dur="2.1s" begin="0.7s" repeatCount="indefinite" values="0;0.6;0" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/></use></g><g transform="translate(1166 68)"><use href="#spark" fill="#ffb7d5" transform="scale(0)"><animateTransform attributeName="transform" type="scale" dur="3.0s" begin="1.3s" repeatCount="indefinite" values="0;0.5;0" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/></use></g>
    <g opacity="0.82"><animateTransform attributeName="transform" type="translate" dur="11.4s" begin="-2.5s" repeatCount="indefinite" values="268 -16;199 76;111 168"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5.8s" repeatCount="indefinite"/><use href="#petal" transform="scale(1.05)" fill="#ffb7d5"/></g></g>
    <g opacity="0.81"><animateTransform attributeName="transform" type="translate" dur="9.0s" begin="-6.8s" repeatCount="indefinite" values="78 -16;13 76;-42 168"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6.2s" repeatCount="indefinite"/><use href="#petal" transform="scale(1.01)" fill="#ffd6e8"/></g></g>
    <g opacity="0.83"><animateTransform attributeName="transform" type="translate" dur="11.8s" begin="-8.2s" repeatCount="indefinite" values="573 -16;508 76;379 168"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="5.3s" repeatCount="indefinite"/><use href="#petal" transform="scale(0.76)" fill="#ffd6e8"/></g></g>
    <g opacity="0.85"><animateTransform attributeName="transform" type="translate" dur="11.9s" begin="-4.1s" repeatCount="indefinite" values="217 -16;154 76;97 168"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4.7s" repeatCount="indefinite"/><use href="#petal" transform="scale(1.15)" fill="#ff8fbf"/></g></g>
    <g opacity="0.72"><animateTransform attributeName="transform" type="translate" dur="14.8s" begin="-13.2s" repeatCount="indefinite" values="356 -16;264 76;213 168"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5.6s" repeatCount="indefinite"/><use href="#petal" transform="scale(0.82)" fill="#ff8fbf"/></g></g>
    <rect x="0.5" y="0.5" width="1199" height="151" rx="16" fill="none" stroke="#3b2f66"/>
  </g>
