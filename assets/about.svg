<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 152" width="1200" height="152" role="img" aria-label="About: Computer Science student from Thrissur, Kerala. I build AI-powered products and contribute to open source, mostly around healthcare.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090a0d"/><stop offset="1" stop-color="#181a20"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff3b0" stop-opacity="0.55"/><stop offset="1" stop-color="#fff3b0" stop-opacity="0"/></linearGradient>
    <linearGradient id="rev" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22c55e"/><stop offset="0.6" stop-color="#fbbf24"/><stop offset="1" stop-color="#e10600"/></linearGradient>
    <pattern id="carbon" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8 L8 0" stroke="#ffffff" stroke-opacity="0.035" stroke-width="2"/></pattern>
    <pattern id="chk" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#0a0a0b"/><rect width="8" height="8" fill="#f5f5f4"/><rect x="8" y="8" width="8" height="8" fill="#f5f5f4"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="16 0" dur="1.6s" repeatCount="indefinite"/></pattern>
    <filter id="blur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="55"/></filter>
    <clipPath id="clip"><rect width="1200" height="152" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="152" fill="url(#bg)"/>
    <rect width="1200" height="152" fill="url(#carbon)"/>
    <circle cx="960" cy="152" r="120" fill="#e10600" opacity="0.2" filter="url(#blur)">
      <animate attributeName="cx" dur="14s" repeatCount="indefinite" values="960;600;960" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </circle>
    <g transform="skewX(-18)"><rect x="62" y="40" width="7" height="74" fill="#e10600"/><rect x="74" y="40" width="3" height="74" fill="#f5f5f4"/></g>
    <text x="78" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="3" fill="#e10600">ABOUT</text>
    <text x="78" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#c4c7cf" text-anchor="start">Computer Science student from Thrissur, Kerala. I build AI-powered products</text>
    <text x="78" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#c4c7cf" text-anchor="start">and contribute to open source, mostly around healthcare.</text>
    
    <rect x="0.5" y="0.5" width="1199" height="151" rx="16" fill="none" stroke="#2a2d35"/>
  </g>
</svg>
