<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="About: Computer Science student from Thrissur, Kerala. I build AI-powered products and contribute to open source, mostly around healthcare.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050405"/><stop offset="1" stop-color="#16070a"/></linearGradient>
    <filter id="blur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="clip"><rect width="1200" height="150" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="150" fill="url(#bg)"/>
    <circle cx="960" cy="150" r="120" fill="#7f1d1d" opacity="0.35" filter="url(#blur)">
      <animate attributeName="cx" dur="17s" repeatCount="indefinite" values="960;660;960" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      <animate attributeName="opacity" dur="5s" repeatCount="indefinite" values="0.35;0.2;0.35"/>
    </circle>
    <g fill="#d6d3d1" filter="url(#blur)" opacity="0.07">
      <ellipse cx="200" cy="140" rx="340" ry="45"><animate attributeName="cx" dur="28s" repeatCount="indefinite" values="200;1000;200"/></ellipse>
      <ellipse cx="1050" cy="150" rx="300" ry="38"><animate attributeName="cx" dur="36s" repeatCount="indefinite" values="1050;250;1050"/></ellipse>
    </g>
    <rect x="40" y="38" width="4" height="74" rx="2" fill="#b91c1c"/>
    <text x="64" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#ef4444">ABOUT</text>
    <text x="64" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#b8aca6" text-anchor="start">Computer Science student from Thrissur, Kerala. I build AI-powered products</text>
    <text x="64" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#b8aca6" text-anchor="start">and contribute to open source, mostly around healthcare.</text>
    

    <rect x="0.5" y="0.5" width="1199" height="149" rx="16" fill="none" stroke="#2e1418"/>
  </g>
</svg>
