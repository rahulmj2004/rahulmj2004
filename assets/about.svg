<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="About: Computer Science student from Thrissur, Kerala. I build AI-powered products and contribute to open source, mostly around healthcare.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#121c33"/></linearGradient>
    <linearGradient id="acc" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#6366f1"/><stop offset="0.5" stop-color="#38bdf8"/><stop offset="1" stop-color="#6366f1"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1200 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="60"/></filter>
    <clipPath id="clip"><rect width="1200" height="150" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="150" fill="url(#bg)"/>
    <circle cx="984" cy="150" r="120" fill="#6366f1" opacity="0.22" filter="url(#blur)">
      <animate attributeName="cx" dur="16s" repeatCount="indefinite" values="984;720;984" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </circle>
    <rect x="40" y="38" width="4" height="74" rx="2" fill="url(#acc)"/>
    <text x="64" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2.5" fill="#8b9bb4">ABOUT</text>
    <text x="64" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#cbd5e1" text-anchor="start">Computer Science student from Thrissur, Kerala. I build AI-powered products</text>
    <text x="64" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#cbd5e1" text-anchor="start">and contribute to open source, mostly around healthcare.</text>
    
    <rect x="0.5" y="0.5" width="1199" height="149" rx="16" fill="none" stroke="#263248"/>
  </g>
</svg>
