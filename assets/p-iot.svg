<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 204" width="1200" height="204" role="img" aria-label="Intelligent IoT Anomaly Detection: detecting anomalies in IoT sensor data with Python.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060a13"/><stop offset="0.6" stop-color="#0b1322"/><stop offset="1" stop-color="#101a30"/></linearGradient>
    <linearGradient id="stripe" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="repeat"><stop offset="0" stop-color="#38e1ff"/><stop offset="0.33" stop-color="#8b7bff"/><stop offset="0.66" stop-color="#34f5a4"/><stop offset="1" stop-color="#38e1ff"/></linearGradient>
    <linearGradient id="energy" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b7bff"/><stop offset="1" stop-color="#38e1ff"/></linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38e1ff" stop-opacity="0"/><stop offset="1" stop-color="#38e1ff" stop-opacity="0.9"/></linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38e1ff" stop-opacity="0"/><stop offset="1" stop-color="#38e1ff" stop-opacity="0.28"/></linearGradient>
    <radialGradient id="htg" gradientUnits="userSpaceOnUse" cx="1200" cy="0" r="520"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#000000"/></radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#6aa8ff" stroke-width="1"/></pattern>
    <mask id="htm" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="204"><rect width="1200" height="204" fill="url(#htg)"/></mask>
    <filter id="blur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
    <clipPath id="clip"><rect width="1200" height="204" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="204" fill="url(#bg)"/>
    <circle cx="960" cy="204" r="142" fill="#8b7bff" opacity="0.16" filter="url(#blur)">
      <animate attributeName="cx" dur="14s" repeatCount="indefinite" values="960;600;960" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </circle>
    <circle cx="240" cy="0" r="142" fill="#38e1ff" opacity="0.10" filter="url(#blur)">
      <animate attributeName="cx" dur="18s" repeatCount="indefinite" values="240;520;240" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </circle>
    <rect width="1200" height="204" fill="url(#grid)" mask="url(#htm)" opacity="0.16"/>
    <text x="44" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="3" fill="#38e1ff">PROJECT<tspan dx="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" letter-spacing="0" fill="#7f8ba3">$ run detect</tspan></text>
    <text x="43" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#f2f6ff" text-anchor="start">Intelligent IoT Anomaly Detection</text>
    <text x="44" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#c3cde0" text-anchor="start">Detecting anomalies in IoT sensor data with Python.</text>
    <rect x="44" y="155" width="74" height="27" rx="6" fill="#101a2c" stroke="#2c4468"/>
    <text x="81" y="174" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#38e1ff" text-anchor="middle">Python</text>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#38e1ff">
      <text x="1122" y="174" text-anchor="end">View repository</text>
      <text x="1132" y="174">→<animateTransform attributeName="transform" type="translate" dur="0.9s" repeatCount="indefinite" values="0 0;9 0;0 0" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/></text>
    </g>
    <g transform="translate(916 30)">
      <polyline points="0,46.4 6,52.3 12,54.4 18,57.5 24,57.4 30,52.1 36,48.4 42,49.2 48,41.8 54,38.8 60,42.0 66,39.4 72,43.9 78,45.3 84,50.4 90,51.3 96,56.8 102,59.2 108,56.2 114,54.9 120,50.8 126,43.0 132,43.6 138,40.2 144,37.8 150,8.0 156,45.4 162,46.9 168,52.5 174,56.8 180,57.9 186,59.4 192,54.6 198,53.9 204,47.8 210,46.7 216,43.2 222,36.8 228,37.1 234,39.5 240,47.4" fill="none" stroke="#38e1ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <rect x="0" y="0" width="2" height="72" fill="#8b7bff" opacity="0.7"><animate attributeName="x" dur="4s" repeatCount="indefinite" values="0;240"/></rect>
      <circle cx="150" cy="8" r="4" fill="none" stroke="#ffc857" stroke-width="2"><animate attributeName="r" dur="1.6s" repeatCount="indefinite" values="4;16"/><animate attributeName="opacity" dur="1.6s" repeatCount="indefinite" values="1;0"/></circle>
      <circle cx="150" cy="8" r="4" fill="#ffc857"/>
      <text x="162" y="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#ffc857">anomaly</text>
    </g>
    <g><animateTransform attributeName="transform" type="translate" dur="9.1s" begin="-8.2s" repeatCount="indefinite" values="110 216;87 -14"/><animate attributeName="opacity" dur="9.1s" begin="-8.2s" repeatCount="indefinite" values="0;0.36;0.36;0" keyTimes="0;0.15;0.8;1"/><text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#34f5a4">1</text></g>
    <g><animateTransform attributeName="transform" type="translate" dur="13.6s" begin="-12.0s" repeatCount="indefinite" values="998 216;1000 -14"/><animate attributeName="opacity" dur="13.6s" begin="-12.0s" repeatCount="indefinite" values="0;0.59;0.59;0" keyTimes="0;0.15;0.8;1"/><rect width="3.6" height="3.6" rx="0.8" fill="#8b7bff"/></g>
    <g><animateTransform attributeName="transform" type="translate" dur="12.4s" begin="-2.5s" repeatCount="indefinite" values="629 216;627 -14"/><animate attributeName="opacity" dur="12.4s" begin="-2.5s" repeatCount="indefinite" values="0;0.73;0.73;0" keyTimes="0;0.15;0.8;1"/><text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8b7bff">1</text></g>
    <g><animateTransform attributeName="transform" type="translate" dur="7.8s" begin="-1.2s" repeatCount="indefinite" values="160 216;198 -14"/><animate attributeName="opacity" dur="7.8s" begin="-1.2s" repeatCount="indefinite" values="0;0.52;0.52;0" keyTimes="0;0.15;0.8;1"/><rect width="3.1" height="3.1" rx="0.8" fill="#38e1ff"/></g>
    <g><animateTransform attributeName="transform" type="translate" dur="12.1s" begin="-6.0s" repeatCount="indefinite" values="283 216;281 -14"/><animate attributeName="opacity" dur="12.1s" begin="-6.0s" repeatCount="indefinite" values="0;0.58;0.58;0" keyTimes="0;0.15;0.8;1"/><rect width="3.5" height="3.5" rx="0.8" fill="#8b7bff"/></g>
    <g><animateTransform attributeName="transform" type="translate" dur="9.3s" begin="-2.3s" repeatCount="indefinite" values="701 216;679 -14"/><animate attributeName="opacity" dur="9.3s" begin="-2.3s" repeatCount="indefinite" values="0;0.69;0.69;0" keyTimes="0;0.15;0.8;1"/><text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#34f5a4">0</text></g>
    <g><animateTransform attributeName="transform" type="translate" from="-600 0" to="0 0" dur="5s" repeatCount="indefinite"/><rect x="0" width="1800" height="4" fill="url(#stripe)"/></g>
    <rect x="0.5" y="0.5" width="1199" height="203" rx="16" fill="none" stroke="#22304a"/>
