    <g><animateTransform attributeName="transform" type="translate" dur="13.9s" begin="-0.4s" repeatCount="indefinite" values="256 244;283 -14"/><animate attributeName="opacity" dur="13.9s" begin="-0.4s" repeatCount="indefinite" values="0;0.61;0.61;0" keyTimes="0;0.15;0.8;1"/><text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#34f5a4">1</text></g>
