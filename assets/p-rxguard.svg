    <g><animateTransform attributeName="transform" type="translate" dur="9.7s" begin="-6.7s" repeatCount="indefinite" values="34 244;3 -14"/><animate attributeName="opacity" dur="9.7s" begin="-6.7s" repeatCount="indefinite" values="0;0.73;0.73;0" keyTimes="0;0.15;0.8;1"/><rect width="3.4" height="3.4" rx="0.8" fill="#38e1ff"/></g>
