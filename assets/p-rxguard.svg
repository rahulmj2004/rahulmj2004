<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 232" width="1200" height="232" role="img" aria-label="RxGuard: a prescription review system for pharmacists. It flags medication-safety concerns and backs each one with evidence, while the pharmacist makes the final call.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060a13"/><stop offset="0.6" stop-color="#0b1322"/><stop offset="1" stop-color="#101a30"/></linearGradient>
    <linearGradient id="stripe" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="repeat"><stop offset="0" stop-color="#38e1ff"/><stop offset="0.33" stop-color="#8b7bff"/><stop offset="0.66" stop-color="#34f5a4"/><stop offset="1" stop-color="#38e1ff"/></linearGradient>
    <linearGradient id="energy" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b7bff"/><stop offset="1" stop-color="#38e1ff"/></linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38e1ff" stop-opacity="0"/><stop offset="1" stop-color="#38e1ff" stop-opacity="0.9"/></linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38e1ff" stop-opacity="0"/><stop offset="1" stop-color="#38e1ff" stop-opacity="0.28"/></linearGradient>
    <radialGradient id="htg" gradientUnits="userSpaceOnUse" cx="1200" cy="0" r="520"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#000000"/></radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#6aa8ff" stroke-width="1"/></pattern>
    <mask id="htm" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="232"><rect width="1200" height="232" fill="url(#htg)"/></mask>
    <filter id="blur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
    <clipPath id="clip"><rect width="1200" height="232" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="232" fill="url(#bg)"/>
    <circle cx="960" cy="232" r="162" fill="#8b7bff" opacity="0.16" filter="url(#blur)">
      <animate attributeName="cx" dur="14s" repeatCount="indefinite" values="960;600;960" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </circle>
    <circle cx="240" cy="0" r="162" fill="#38e1ff" opacity="0.10" filter="url(#blur)">
      <animate attributeName="cx" dur="18s" repeatCount="indefinite" values="240;520;240" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </circle>
    <rect width="1200" height="232" fill="url(#grid)" mask="url(#htm)" opacity="0.16"/>
    <text x="44" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="3" fill="#38e1ff">PROJECT<tspan dx="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" letter-spacing="0" fill="#7f8ba3">$ run rxguard</tspan></text>
    <text x="43" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#f2f6ff" text-anchor="start">RxGuard</text>
    <text x="44" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#c3cde0" text-anchor="start">A prescription review system for pharmacists. It flags medication-safety concerns and backs</text>
    <text x="44" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#c3cde0" text-anchor="start">each one with evidence, while the pharmacist makes the final call.</text>
    <rect x="44" y="183" width="74" height="27" rx="6" fill="#101a2c" stroke="#2c4468"/>
    <text x="81" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#38e1ff" text-anchor="middle">Python</text>
