    <text x="44" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#b8aca6" text-anchor="start">A prescription review system for pharmacists. It flags medication-safety concerns and backs</text>
    <text x="44" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#b8aca6" text-anchor="start">each one with evidence, while the pharmacist makes the final call.</text>
    <rect x="44" y="173" width="74" height="27" rx="13.5" fill="#1a0b0e" stroke="#4a1a1f"/>
