<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Hey there, I'm Rahul M J. CS student, AI for healthcare, open source.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="700" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#c7d2fe"/>
      <stop offset="0.5" stop-color="#67e8f9"/>
      <stop offset="0.65" stop-color="#c7d2fe"/>
      <stop offset="1" stop-color="#ffffff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-500 0; 500 0; -500 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="bar" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.33" stop-color="#22d3ee"/>
      <stop offset="0.66" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#6366f1"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1200 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <clipPath id="card">
      <rect width="1200" height="320" rx="18"/>
    </clipPath>
  </defs>

  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .rise { animation: rise 0.9s cubic-bezier(.2,.7,.2,1) both; }
    .d1 { animation-delay: 0.15s; }
    .d2 { animation-delay: 0.45s; }
    .d3 { animation-delay: 0.85s; }
    .blob { transform-box: fill-box; transform-origin: center; }
    .b1 { animation: drift1 14s ease-in-out infinite alternate; }
    .b2 { animation: drift2 18s ease-in-out infinite alternate; }
    .b3 { animation: drift3 16s ease-in-out infinite alternate; }
    .ring { transform-box: fill-box; transform-origin: center; animation: pulse 4s ease-out infinite; }
    .r2 { animation-delay: 1.33s; }
    .r3 { animation-delay: 2.66s; }
    .icon { animation: float 5s ease-in-out infinite; }
    .draw { stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 1.2s 0.7s ease-out forwards; }
    .star { animation: twinkle 3.5s ease-in-out infinite; }
    .s2 { animation-delay: 1.1s; }
    .s3 { animation-delay: 2.2s; }
    .s4 { animation-delay: 0.6s; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes drift1 { to { transform: translate(90px, 40px) scale(1.15); } }
    @keyframes drift2 { to { transform: translate(-110px, -30px) scale(1.2); } }
    @keyframes drift3 { to { transform: translate(60px, -50px) scale(0.9); } }
    @keyframes pulse { 0% { transform: scale(0.55); opacity: 0.55; } 100% { transform: scale(1.5); opacity: 0; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes twinkle { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.9; } }
    @media (prefers-reduced-motion: reduce) {
      .rise, .blob, .ring, .icon, .star { animation: none; }
      .draw { animation: none; stroke-dashoffset: 0; }
      .ring { opacity: 0.18; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>

    <g filter="url(#blur)" opacity="0.75">
      <circle class="blob b1" cx="170" cy="40" r="130" fill="#6366f1"/>
      <circle class="blob b2" cx="1060" cy="270" r="150" fill="#a855f7"/>
      <circle class="blob b3" cx="700" cy="330" r="110" fill="#22d3ee" opacity="0.55"/>
    </g>

    <g fill="#ffffff">
      <circle class="star" cx="560" cy="58" r="2"/>
      <circle class="star s2" cx="690" cy="118" r="1.6"/>
      <circle class="star s3" cx="800" cy="52" r="2.2"/>
      <circle class="star s4" cx="745" cy="232" r="1.6"/>
      <circle class="star s2" cx="1150" cy="48" r="1.8"/>
      <circle class="star s3" cx="620" cy="262" r="1.4"/>
    </g>

    <g transform="translate(1000 150)">
      <g fill="none" stroke="#a5b4fc" stroke-width="2">
        <circle class="ring" r="92"/>
        <circle class="ring r2" r="92"/>
        <circle class="ring r3" r="92"/>
      </g>
      <g class="icon">
        <circle r="70" fill="#ffffff" opacity="0.08"/>
        <circle r="70" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
        <g fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
          <polyline class="draw" pathLength="100" points="-18,-28 -46,0 -18,28"/>
          <polyline class="draw" pathLength="100" points="18,-28 46,0 18,28"/>
          <line class="draw" pathLength="100" stroke="#67e8f9" x1="9" y1="-38" x2="-9" y2="38"/>
        </g>
      </g>
    </g>

    <g class="t">
      <text class="rise d1" x="64" y="118" font-size="44" font-weight="300" fill="#c7d2fe">Hey there,</text>
      <text class="rise d2" x="62" y="196" font-size="76" font-weight="800" fill="url(#name)">I’m Rahul M J</text>
      <text class="rise d3" x="66" y="244" font-size="22" font-weight="500" fill="#a5b4fc" letter-spacing="0.5">CS student  ·  AI for healthcare  ·  open source</text>
    </g>

    <rect x="0" y="312" width="1200" height="8" fill="url(#bar)"/>
  </g>
</svg>
