<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Hey there, I'm Rahul M J. CS student from Kerala, building AI for healthcare, open-source contributor.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="700" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#c7d2fe"/>
      <stop offset="0.5" stop-color="#67e8f9"/>
      <stop offset="0.65" stop-color="#c7d2fe"/>
      <stop offset="1" stop-color="#ffffff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-520 0; 520 0" dur="3.2s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="bar" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.33" stop-color="#22d3ee"/>
      <stop offset="0.66" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#6366f1"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1200 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <clipPath id="card">
      <rect width="1200" height="320" rx="18"/>
    </clipPath>
    <!-- rotating tagline: each line wipes in like typing, holds, then clears (9s cycle) -->
    <clipPath id="c1">
      <rect x="60" y="216" height="40" width="560">
        <animate attributeName="width" dur="9s" repeatCount="indefinite" values="0;560;560;0;0" keyTimes="0;0.12;0.30;0.333;1"/>
      </rect>
    </clipPath>
    <clipPath id="c2">
      <rect x="60" y="216" height="40" width="0">
        <animate attributeName="width" dur="9s" repeatCount="indefinite" values="0;0;560;560;0;0" keyTimes="0;0.333;0.453;0.633;0.666;1"/>
      </rect>
    </clipPath>
    <clipPath id="c3">
      <rect x="60" y="216" height="40" width="0">
        <animate attributeName="width" dur="9s" repeatCount="indefinite" values="0;0;560;560;0" keyTimes="0;0.666;0.786;0.966;1"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>

    <!-- drifting glows -->
    <g filter="url(#blur)" opacity="0.8">
      <circle cx="170" cy="40" r="130" fill="#6366f1">
        <animate attributeName="cx" dur="7s" repeatCount="indefinite" values="170;420;170" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
        <animate attributeName="cy" dur="5s" repeatCount="indefinite" values="40;120;40" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      </circle>
      <circle cx="1060" cy="270" r="150" fill="#a855f7">
        <animate attributeName="cx" dur="8s" repeatCount="indefinite" values="1060;820;1060" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
        <animate attributeName="cy" dur="6s" repeatCount="indefinite" values="270;180;270" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      </circle>
      <circle cx="640" cy="340" r="110" fill="#22d3ee" opacity="0.55">
        <animate attributeName="cx" dur="9s" repeatCount="indefinite" values="640;880;480;640" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"/>
        <animate attributeName="r" dur="5s" repeatCount="indefinite" values="110;150;110"/>
      </circle>
    </g>

    <!-- twinkling stars -->
    <g fill="#ffffff">
      <circle cx="560" cy="58" r="2"><animate attributeName="opacity" dur="2.2s" repeatCount="indefinite" values="0.1;1;0.1"/></circle>
      <circle cx="690" cy="118" r="1.6"><animate attributeName="opacity" dur="1.7s" begin="0.4s" repeatCount="indefinite" values="0.1;1;0.1"/></circle>
      <circle cx="800" cy="52" r="2.2"><animate attributeName="opacity" dur="2.6s" begin="0.9s" repeatCount="indefinite" values="0.1;1;0.1"/></circle>
      <circle cx="745" cy="200" r="1.6"><animate attributeName="opacity" dur="1.9s" begin="0.2s" repeatCount="indefinite" values="0.1;1;0.1"/></circle>
      <circle cx="1150" cy="48" r="1.8"><animate attributeName="opacity" dur="2.4s" begin="1.2s" repeatCount="indefinite" values="0.1;1;0.1"/></circle>
      <circle cx="455" cy="40" r="1.5"><animate attributeName="opacity" dur="2s" begin="0.7s" repeatCount="indefinite" values="0.1;1;0.1"/></circle>
    </g>

    <!-- shooting stars -->
    <g opacity="0">
      <animate attributeName="opacity" dur="5s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.08;0.12;0.26;0.32;1"/>
      <animateTransform attributeName="transform" type="translate" dur="5s" repeatCount="indefinite" values="430 -10; 430 -10; 800 150; 800 150" keyTimes="0;0.08;0.32;1"/>
      <line x1="-90" y1="-39" x2="0" y2="0" stroke="url(#trail)" stroke-width="2.5" stroke-linecap="round"/>
      <circle r="2.6" fill="#ffffff"/>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" dur="7s" begin="2.5s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1;0.14;0.26;0.32;1"/>
      <animateTransform attributeName="transform" type="translate" dur="7s" begin="2.5s" repeatCount="indefinite" values="620 20; 620 20; 900 140; 900 140" keyTimes="0;0.1;0.32;1"/>
      <line x1="-70" y1="-30" x2="0" y2="0" stroke="url(#trail)" stroke-width="2" stroke-linecap="round"/>
      <circle r="2" fill="#ffffff"/>
    </g>

    <!-- flowing waves -->
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="6s" repeatCount="indefinite"/>
      <path fill="#818cf8" fill-opacity="0.22" d="M0 282 q150 -34 300 0 t300 0 t300 0 t300 0 t300 0 t300 0 V330 H0 Z"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="-600 0" to="0 0" dur="9s" repeatCount="indefinite"/>
      <path fill="#22d3ee" fill-opacity="0.14" d="M0 294 q150 26 300 0 t300 0 t300 0 t300 0 t300 0 t300 0 V330 H0 Z"/>
    </g>

    <!-- code symbol -->
    <g transform="translate(1000 146)">
      <g fill="none" stroke="#a5b4fc" stroke-width="2">
        <circle r="60"><animate attributeName="r" dur="3s" repeatCount="indefinite" values="60;135"/><animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="0.7;0"/></circle>
        <circle r="60"><animate attributeName="r" dur="3s" begin="1s" repeatCount="indefinite" values="60;135"/><animate attributeName="opacity" dur="3s" begin="1s" repeatCount="indefinite" values="0.7;0"/></circle>
        <circle r="60"><animate attributeName="r" dur="3s" begin="2s" repeatCount="indefinite" values="60;135"/><animate attributeName="opacity" dur="3s" begin="2s" repeatCount="indefinite" values="0.7;0"/></circle>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
        <circle cx="0" cy="-98" r="6" fill="#67e8f9"/>
        <circle cx="0" cy="98" r="4" fill="#c4b5fd"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="8s" repeatCount="indefinite"/>
        <circle cx="118" cy="0" r="4.5" fill="#f0abfc"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" dur="3s" repeatCount="indefinite" values="0 6; 0 -8; 0 6" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
        <circle r="70" fill="#ffffff" fill-opacity="0.1"/>
        <circle r="70" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.5"/>
        <g fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="-18,-28 -46,0 -18,28">
            <animateTransform attributeName="transform" type="translate" dur="1.6s" repeatCount="indefinite" values="0 0; -6 0; 0 0"/>
          </polyline>
          <polyline points="18,-28 46,0 18,28">
            <animateTransform attributeName="transform" type="translate" dur="1.6s" repeatCount="indefinite" values="0 0; 6 0; 0 0"/>
          </polyline>
          <line x1="9" y1="-38" x2="-9" y2="38" stroke="#67e8f9">
            <animate attributeName="stroke" dur="4s" repeatCount="indefinite" values="#67e8f9;#f0abfc;#a5b4fc;#67e8f9"/>
          </line>
        </g>
      </g>
    </g>

    <!-- text -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="64" y="112" font-size="44" font-weight="300" fill="#c7d2fe">Hey there,</text>
      <text x="62" y="190" font-size="76" font-weight="800" fill="url(#name)">I’m Rahul M J</text>
      <g font-size="24" font-weight="500" fill="#a5f3fc">
        <text x="66" y="244" clip-path="url(#c1)">&gt; CS student from Kerala</text>
        <text x="66" y="244" clip-path="url(#c2)">&gt; Building AI for healthcare</text>
        <text x="66" y="244" clip-path="url(#c3)">&gt; Open-source contributor</text>
      </g>
    </g>

    <rect x="0" y="312" width="1200" height="8" fill="url(#bar)"/>
  </g>
</svg>
